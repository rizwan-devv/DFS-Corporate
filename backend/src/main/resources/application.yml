server:
  port: 8090

spring:
  application:
    name: dfs-corporate
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:dfs_corporate}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:dfs}
    password: ${MYSQL_PASSWORD:change-me}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 80MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  jwt:
    secret: ${JWT_SECRET:dfs-corporate-dev-secret-change-me-in-production-32chars-min}
    expiration-ms: 86400000
  upload-dir: ./uploads
  cors-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,capacitor://localhost,http://localhost
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  mobile-app-base-url: ${MOBILE_APP_BASE_URL:dfscorporate://kyc}
  mail:
    from: noreply@dfscorporate.local
    # When false, credentials/OTP are logged instead of SMTP send (easy local testing)
    enabled: ${MAIL_ENABLED:false}

# External DFS backend corporate account create API
dfs:
  account-api:
    enabled: ${DFS_ACCOUNT_API_ENABLED:false}
    base-url: ${DFS_ACCOUNT_API_BASE_URL:http://46.225.160.93:18001}
    path: /agentapp/v1/corporateonboarding
    segments-path: /agentapp/v1/getAllSegments
    lovs-path: /agentapp/v1/getAllLovs
    channel: AGNT
    level-code: L4
    default-city-id: "1"
    default-business-type-id: "1"
    default-monthly-volume-id: "1"
    api-key: ${DFS_ACCOUNT_API_KEY:}
    use-stub: false

logging:
  level:
    com.dfs.corporate: INFO
