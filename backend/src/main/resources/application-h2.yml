# Optional H2 profile: --spring.profiles.active=h2
spring:
  datasource:
    url: jdbc:h2:file:./data/dfs-corporate;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
